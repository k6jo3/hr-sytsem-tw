# Test Configuration for Notification Service
# datasource URL/driver/username/password 由 Testcontainers @DynamicPropertySource 動態覆蓋
spring:
  application:
    name: hrms-notification-test
  main:
    allow-bean-definition-overriding: true

  datasource:
    url: jdbc:postgresql://localhost:5432/hrms_test
    driver-class-name: org.postgresql.Driver
    username: test
    password: test

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # 測試環境停用 Kafka，避免嘗試連線 localhost:9092 導致 ApplicationContext 載入失敗
  kafka:
    enabled: false

  # 測試環境停用 Redis Repository 自動配置
  data:
    redis:
      repositories:
        enabled: false

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.mail.MailHealthContributorAutoConfiguration

  # 測試環境 Mail 配置（指向不存在的 host，但 email.enabled=false 所以不會實際連線）
  mail:
    host: localhost
    port: 1025

management:
  health:
    mail:
      enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

# JWT Configuration for Testing
jwt:
  secret: test-secret-key-for-jwt-token-generation-must-be-long-enough-256-bits
  access-token-expiry: 3600000
  refresh-token-expiry: 604800000

# 測試環境停用 Email 通道，避免嘗試連線 SMTP
hrms:
  notification:
    channel:
      email:
        enabled: false

logging:
  level:
    com.company.hrms.notification: DEBUG
