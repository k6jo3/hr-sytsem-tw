# Test Configuration for IAM Service
# datasource URL/driver/username/password 由 Testcontainers @DynamicPropertySource 動態覆蓋
spring:
  datasource:
    # 預設值（會被 Testcontainers 覆蓋）
    url: jdbc:postgresql://localhost:5432/hrms_test
    driver-class-name: org.postgresql.Driver
    username: test
    password: test

  # 使用 @Sql 註解載入測試資料
  sql:
    init:
      mode: never

  jpa:
    hibernate:
      # none：schema 由 @Sql 的 SQL script 管理（CREATE TABLE IF NOT EXISTS）
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

  kafka:
    enabled: false

# JWT Configuration for Testing
jwt:
  secret: test-secret-key-for-jwt-token-generation-must-be-long-enough-256-bits
  access-token-expiry: 3600000
  refresh-token-expiry: 604800000

# Disable Eureka for Tests
eureka:
  client:
    enabled: false

# Disable Redis for Tests
spring.data.redis:
  host: localhost
  port: 6379

# Logging
logging:
  level:
    com.company.hrms: DEBUG
    org.springframework.security: DEBUG
    com.company.hrms.iam.infrastructure.mapper: TRACE
    org.mybatis: DEBUG
