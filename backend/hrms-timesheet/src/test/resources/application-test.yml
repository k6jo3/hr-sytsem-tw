# Test Configuration for Timesheet Service
# datasource URL/driver/username/password 由 Testcontainers @DynamicPropertySource 動態覆蓋
spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: hrms-timesheet-test
  datasource:
    url: jdbc:postgresql://localhost:5432/hrms_test
    driver-class-name: org.postgresql.Driver
    username: test
    password: test
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    enabled: false

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.company.hrms.timesheet.infrastructure.po
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    com.company.hrms.timesheet: DEBUG
