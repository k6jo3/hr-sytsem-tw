# Test Configuration for Payroll Service
# datasource URL/driver/username/password 由 Testcontainers @DynamicPropertySource 動態覆蓋
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/hrms_test
    driver-class-name: org.postgresql.Driver
    username: test
    password: test

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Disable Eureka for Tests
eureka:
  client:
    enabled: false

# Disable Redis for Tests
spring.data.redis:
  host: localhost
  port: 6379

# Disable Kafka for Tests
spring.kafka:
  bootstrap-servers: localhost:9092
  consumer:
    auto-startup: false

# Logging
logging:
  level:
    com.company.hrms: DEBUG
    org.hibernate.SQL: DEBUG
