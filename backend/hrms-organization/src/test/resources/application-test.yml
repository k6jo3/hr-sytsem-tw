# Test Configuration for Organization Service
# datasource URL/driver/username/password 由 Testcontainers @DynamicPropertySource 動態覆蓋
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/hrms_test
    driver-class-name: org.postgresql.Driver
    username: test
    password: test
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  cloud:
    discovery:
      enabled: false

eureka:
  client:
    enabled: false

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
